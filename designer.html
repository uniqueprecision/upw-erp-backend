<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UPW ERP – Designer</title>

  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/qrious/dist/qrious.min.js"></script>
</head>

<body>

<!-- ===== TOP BAR ===== -->
<div class="topbar">
  <div class="logo">UPW ERP – Designer</div>
  <div class="profile">Designer</div>
</div>

<div class="layout">

  <!-- ===== SIDEBAR ===== -->
  <div class="sidebar">
    <h4>DESIGNER</h4>
    <a class="active" onclick="showDesignerPage('dashboard')">
      Assigned Orders
    </a>
  </div>

  <!-- ===== MAIN ===== -->
  <div class="main">

    <!-- ================= DASHBOARD ================= -->
    <div class="page active" id="page-dashboard">

      <!-- KPI -->
      <div class="stats">
        <div class="stat-card blue">
          <p>Assigned</p>
          <h2 id="kpiAssigned">0</h2>
        </div>
        <div class="stat-card amber">
          <p>In Progress</p>
          <h2 id="kpiInProgress">0</h2>
        </div>
        <div class="stat-card green">
          <p>Completed</p>
          <h2 id="kpiCompleted">0</h2>
        </div>
        <div class="stat-card gray">
          <p>Sent to Production</p>
          <h2 id="kpiProduction">0</h2>
        </div>
      </div>

      <!-- TABLE -->
      <div class="card">
        <h3>Assigned Orders</h3>
        <table>
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Customer</th>
              <th>Requirement</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="designerOrders"></tbody>
        </table>
      </div>

    </div>

    <!-- ================= DESIGN WORKSPACE ================= -->
    <div class="page" id="page-design">

      <div class="card">
        <h3 class="section-title">Design Workspace</h3>


        <div class="form-row">
          <input id="wsOrderId" readonly placeholder="Order ID">
          <input id="wsCustomer" readonly placeholder="Customer">
        </div>

        <div class="form-row">
          <input id="wsRequirement" readonly placeholder="Requirement">
          <input id="wsDesignNo" readonly placeholder="Design No">
        </div>

        <div class="form-row">
          <input id="wsDesignerName" placeholder="Designer Name" required>
          <input id="wsDesignDate" type="date">
        </div>

        <div class="form-row">
          <input id="wsRemarks" placeholder="Design Notes">
        </div>

        <!-- ===== EXTRA DESIGN DETAILS ===== -->
<div class="form-row">
  <select id="wsDesignType">
    <option value="NEW">New Design</option>
    <option value="REWORK">Rework</option>
  </select>

  <input id="wsMaterial" placeholder="Material Used">
</div>

<div class="machine-box">
  <label class="machine-pill">
    <input type="checkbox" class="machineChk" value="VMC">
    <span>VMC</span>
  </label>

  <label class="machine-pill">
    <input type="checkbox" class="machineChk" value="CNC">
    <span>CNC</span>
  </label>

  <label class="machine-pill">
    <input type="checkbox" class="machineChk" value="LATHE">
    <span>LATHE</span>
  </label>

  <label class="machine-pill">
    <input type="checkbox" class="machineChk" value="GRINDING">
    <span>GRINDING</span>
  </label>
</div>
<div style="height: 16px;"></div>

<div class="form-row">
  <textarea id="wsOperatorRemark"
    placeholder="Operator Instructions"></textarea>
</div>

        <div class="qr-section">
  <h4>Job QR Code</h4>

  <div class="qr-box">
    <canvas id="qrCanvas"></canvas>
    <p id="qrText"></p>
  </div>

 <button id="btnQR" onclick="generateQR()">
  Generate QR
</button>

<button id="btnComplete" onclick="completeDesign()">
  Design Completed & Create Job
</button>


</div>



    <!-- ================= PRODUCTION CONFIRM ================= -->
    <div class="page" id="page-production">
      <div class="card">
        <h3>Design Completed</h3>
        <p>Job created and sent to production.</p>
        <p>QR will be used by Operator.</p>
      </div>
    </div>

  </div>
</div>

<script src="designer.js"></script>
</body>
</html>
